server {
    listen 80;
    server_name _;
    root /var/www/app/public;          # shared read-only from the app image (see compose)
    index index.php;

    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP to the php-fpm container. SCRIPT_FILENAME must be the path AS SEEN BY
    # php-fpm (inside the `app` container), not by nginx.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   /var/www/app/public;
    }

    location ~ /\.(?!well-known).* { deny all; }   # hide dotfiles (.env, .git…)
}
