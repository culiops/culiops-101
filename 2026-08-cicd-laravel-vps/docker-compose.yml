# The whole stack — the SAME file runs locally (Path A: `docker compose up -d --build`)
# and on the VPS (Path B: deploy.sh sets APP_IMAGE=ghcr.io/...:<sha> then `pull` + `up`).
# On the VPS nothing is built; it only pulls the CI-built image.

x-app: &app-common
  image: ${APP_IMAGE:-deploy-laravel-vps:local}
  build: .                       # used locally; ignored on the VPS (image is pulled)
  env_file: .env                 # secrets injected at RUNTIME, never baked into the image
  depends_on:
    mysql:   { condition: service_healthy }
    redis:   { condition: service_healthy }
  restart: unless-stopped

services:
  web:
    image: nginx:1.27-alpine
    ports: ["${WEB_PORT:-80}:80"]           # VPS: 80. Locally set WEB_PORT if 80 is taken.
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/app/public:ro      # served from the app image (seeded below)
    depends_on:
      app: { condition: service_started }
    healthcheck:                            # the STACK is 'healthy' only when /health is 200
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:                                       # php-fpm — serves PHP on :9000
    <<: *app-common
    volumes:
      - storage:/var/www/app/storage         # named volume → correct UID (the §3 fix)
      - public:/var/www/app/public           # export public/ to nginx

  worker:                                    # queue worker — a SEPARATE container (§4.1)
    <<: *app-common
    command: php artisan queue:work --tries=3 --max-jobs=1000 --max-time=3600
    stop_signal: SIGTERM                     # Laravel drains the current job on SIGTERM…
    stop_grace_period: 60s                   # …give it time; default 10s SIGKILLs mid-job
    volumes:
      - storage:/var/www/app/storage

  scheduler:                                 # schedule:work — its OWN container too (§4.1)
    <<: *app-common
    command: php artisan schedule:work
    volumes:
      - storage:/var/www/app/storage

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql            # persist data across recreates
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  storage:        # Laravel storage/ — owned by www-data via the image (the §3 fix)
  public:         # public/ shared app→nginx, seeded from the app image
  mysql-data:
