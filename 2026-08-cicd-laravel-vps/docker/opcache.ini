; Production opcache. validate_timestamps=0 means PHP never re-checks source files
; for changes — bytecode is compiled once and served for the life of the process.
; In a container that is exactly right: a NEW IMAGE (new container) is the only way
; new code ships, so there is no stale-file problem like on a symlink-swap VPS.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
